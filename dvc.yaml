stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    outs:
    - data/raw
  train:
    cmd: python src/train.py
    deps:
    - data/processed
    - src/train.py
    params:
    - train
    outs:
    - models
    frozen: true
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed
    - models/model.h5
    - src/evaluate.py
    params:
    - train.batch_size
    - train.learning_rate
    outs:
    - confusion_matrix.png
    metrics:
    - metrics.json:
        cache: false
    frozen: true
